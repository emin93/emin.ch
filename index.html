<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emin Khateeb — Senior Software Engineer</title>
  <meta name="description" content="Emin Khateeb — Senior Software Engineer focused on mobile app development, currently employed, and expanding into AI development." />
  <link rel="canonical" href="https://emin.ch/" />
  <meta property="og:title" content="Emin Khateeb" />
  <meta property="og:description" content="Senior Software Engineer — Mobile-first, currently employed, building with AI." />
  <meta property="og:type" content="website" />

  <meta name="theme-color" content="#0b0f10" />

</head>
<body>
  <main class="wrap">
    <section class="terminal" aria-label="Terminal profile card">
      <header class="terminal-bar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <p class="title">emin@horizon:~</p>
      </header>

      <div class="terminal-body">
        <p><span class="prompt">$</span> whoami</p>
        <p><span class="output">Emin Khateeb</span></p>

        <p><span class="prompt">$</span> role --current</p>
        <p><span class="output">Senior Software Engineer</span></p>

        <p><span class="prompt">$</span> focus --primary</p>
        <p><span class="output">Mobile app development</span></p>

        <p><span class="prompt">$</span> now</p>
        <p><span class="output">Recently left Kraken. Open to new opportunities.</span></p>

        <p><span class="prompt">$</span> growth --next</p>
        <p><span class="output">Ramping up in AI development.</span></p>

        <p><span class="prompt">$</span> links</p>
        <p class="links">
          <a href="https://github.com/emin93" target="_blank" rel="noreferrer">GitHub</a>
          <a href="https://twitter.com/lifeIsCamelCase" target="_blank" rel="noreferrer">X / Twitter</a>
          <a href="https://medium.com/@emin93" target="_blank" rel="noreferrer">Medium</a>
          <a href="https://www.linkedin.com/in/eminch/" target="_blank" rel="noreferrer">LinkedIn</a>
        </p>

        <p class="cursor-line"><span class="prompt">$</span> <span class="cursor" aria-hidden="true"></span></p>
      </div>
    </section>
  </main>
</body>
</html>
